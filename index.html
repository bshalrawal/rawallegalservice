<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Rawal Legal Service — Our new website is under construction. We are building something worthy of your trust." />
  <title>Rawal Legal Service — Under Construction</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Page Loader -->
  <div class="page-loader" aria-hidden="true">
    <div class="loader-bar"></div>
  </div>

  <!-- Background Canvas (particles) -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- Blueprint Grid Overlay -->
  <div class="blueprint-grid" aria-hidden="true"></div>

  <!-- Ambient Light Rays -->
  <div class="light-rays" aria-hidden="true">
    <div class="ray"></div>
    <div class="ray"></div>
    <div class="ray"></div>
    <div class="ray"></div>
  </div>

  <!-- Column Decorations -->
  <div class="column-decor column-decor--left" aria-hidden="true">
    <div class="column-decor__line"></div>
    <div class="column-decor__line"></div>
    <div class="column-decor__line"></div>
  </div>
  <div class="column-decor column-decor--right" aria-hidden="true">
    <div class="column-decor__line"></div>
    <div class="column-decor__line"></div>
    <div class="column-decor__line"></div>
  </div>

  <!-- Page Wrapper -->
  <div class="page-wrapper">
    <main class="main-content" role="main">

      <!-- Scales of Justice — SVG Centerpiece -->
      <div class="scales-container" aria-hidden="true">
        <svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Outer circle -->
          <circle cx="200" cy="200" r="175" stroke="rgba(201,168,76,0.06)" stroke-width="0.5" class="draw-line" />
          <!-- Inner circle -->
          <circle cx="200" cy="200" r="130" stroke="rgba(201,168,76,0.04)" stroke-width="0.5" class="draw-line-slow" />

          <!-- Central pillar -->
          <line x1="200" y1="80" x2="200" y2="310" stroke="rgba(201,168,76,0.08)" stroke-width="0.8" class="draw-line" />

          <!-- Balance beam -->
          <line x1="110" y1="140" x2="290" y2="140" stroke="rgba(201,168,76,0.10)" stroke-width="0.8" class="draw-line" />

          <!-- Left scale arm -->
          <line x1="130" y1="140" x2="115" y2="200" stroke="rgba(201,168,76,0.07)" stroke-width="0.5" class="draw-line-slow" />
          <line x1="130" y1="140" x2="145" y2="200" stroke="rgba(201,168,76,0.07)" stroke-width="0.5" class="draw-line-slow" />
          <!-- Left pan -->
          <path d="M105 200 Q115 215 125 200" stroke="rgba(201,168,76,0.08)" stroke-width="0.5" fill="none" class="draw-line-slow" />
          <path d="M125 200 Q135 215 145 200" stroke="rgba(201,168,76,0.08)" stroke-width="0.5" fill="none" class="draw-line-slow" />

          <!-- Right scale arm -->
          <line x1="270" y1="140" x2="255" y2="200" stroke="rgba(201,168,76,0.07)" stroke-width="0.5" class="draw-line-slow" />
          <line x1="270" y1="140" x2="285" y2="200" stroke="rgba(201,168,76,0.07)" stroke-width="0.5" class="draw-line-slow" />
          <!-- Right pan -->
          <path d="M245 200 Q255 215 265 200" stroke="rgba(201,168,76,0.08)" stroke-width="0.5" fill="none" class="draw-line-slow" />
          <path d="M265 200 Q275 215 285 200" stroke="rgba(201,168,76,0.08)" stroke-width="0.5" fill="none" class="draw-line-slow" />

          <!-- Pillar base / pedestal lines -->
          <line x1="175" y1="310" x2="225" y2="310" stroke="rgba(201,168,76,0.09)" stroke-width="0.8" class="draw-line" />
          <line x1="165" y1="318" x2="235" y2="318" stroke="rgba(201,168,76,0.06)" stroke-width="0.5" class="draw-line-slow" />

          <!-- Decorative compass / drafting marks -->
          <line x1="200" y1="55" x2="200" y2="70" stroke="rgba(201,168,76,0.06)" stroke-width="0.4" class="draw-line-slow" />
          <line x1="200" y1="330" x2="200" y2="345" stroke="rgba(201,168,76,0.06)" stroke-width="0.4" class="draw-line-slow" />
          <line x1="55" y1="200" x2="70" y2="200" stroke="rgba(201,168,76,0.06)" stroke-width="0.4" class="draw-line-slow" />
          <line x1="330" y1="200" x2="345" y2="200" stroke="rgba(201,168,76,0.06)" stroke-width="0.4" class="draw-line-slow" />

          <!-- Corner drafting angles -->
          <polyline points="90,90 90,105 105,105" stroke="rgba(201,168,76,0.05)" stroke-width="0.4" fill="none" class="draw-line-slow" />
          <polyline points="310,90 310,105 295,105" stroke="rgba(201,168,76,0.05)" stroke-width="0.4" fill="none" class="draw-line-slow" />
          <polyline points="90,310 90,295 105,295" stroke="rgba(201,168,76,0.05)" stroke-width="0.4" fill="none" class="draw-line-slow" />
          <polyline points="310,310 310,295 295,295" stroke="rgba(201,168,76,0.05)" stroke-width="0.4" fill="none" class="draw-line-slow" />
        </svg>
      </div>

      <!-- Branding -->
      <header class="brand">
        <h1 class="brand__name">RAWAL</h1>
        <p class="brand__tagline">Legal Service</p>
      </header>

      <!-- Divider -->
      <div class="divider" aria-hidden="true">
        <span class="divider__line"></span>
        <span class="divider__diamond"></span>
        <span class="divider__line"></span>
      </div>

      <!-- Main Message -->
      <section class="message">
        <p class="message__primary" aria-live="polite">
          <span class="shimmer-text" id="typewriter"></span><span class="cursor" aria-hidden="true"></span>
        </p>
        <p class="message__secondary">
          We are building something worthy of your trust.<br />
          Our new digital presence is being carefully crafted.
        </p>
      </section>

      <!-- Status Card -->
      <div class="status-card">
        <p class="status-card__label">Site Development</p>
        <div class="progress-track">
          <div class="progress-fill"></div>
        </div>
      </div>

    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <p class="site-footer__brand">Rawal Legal Service</p>
      <p class="site-footer__copy">&copy; <span id="copy-year"></span> Rawal Legal Service. All rights reserved.</p>
      <p class="site-footer__contact">contact@rawallegal.com</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
